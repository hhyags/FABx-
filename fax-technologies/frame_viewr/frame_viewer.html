<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>FABX Innovations Cine — Frame by Frame</title>
<style>
  :root{
    --bg:#0b0b0d;
    --panel:#151518;
    --accent:#ff5a3c;
    --text:#eaeaea;
    --muted:#8a8a90;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    display:flex;
    flex-direction:column;
    align-items:center;
    min-height:100vh;
    padding:24px 16px 40px;
  }
  h1{
    font-size:15px;
    letter-spacing:0.08em;
    text-transform:uppercase;
    color:var(--muted);
    font-weight:600;
    margin:0 0 18px;
  }
  h1 span{color:var(--text);}
  .stage{
    position:relative;
    width:min(90vw, 960px);
    background:#000;
    border-radius:10px;
    overflow:hidden;
    box-shadow:0 20px 60px rgba(0,0,0,0.5);
    border:1px solid #232326;
  }
  .stage img{
    display:block;
    width:100%;
    height:auto;
  }
  .frame-tag{
    position:absolute;
    top:12px;
    left:12px;
    background:rgba(0,0,0,0.6);
    backdrop-filter:blur(4px);
    padding:4px 10px;
    border-radius:20px;
    font-size:12px;
    font-variant-numeric:tabular-nums;
    letter-spacing:0.03em;
    border:1px solid rgba(255,255,255,0.08);
  }
  .controls{
    width:min(90vw, 960px);
    margin-top:18px;
    display:flex;
    flex-direction:column;
    gap:12px;
  }
  .scrub{
    -webkit-appearance:none;
    appearance:none;
    width:100%;
    height:4px;
    border-radius:2px;
    background:#2a2a2e;
    outline:none;
  }
  .scrub::-webkit-slider-thumb{
    -webkit-appearance:none;
    appearance:none;
    width:15px;height:15px;
    border-radius:50%;
    background:var(--accent);
    cursor:pointer;
    border:2px solid #fff;
    margin-top:-1px;
  }
  .scrub::-moz-range-thumb{
    width:13px;height:13px;
    border-radius:50%;
    background:var(--accent);
    cursor:pointer;
    border:2px solid #fff;
  }
  .row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
  }
  .btns{
    display:flex;
    gap:8px;
  }
  button{
    background:var(--panel);
    color:var(--text);
    border:1px solid #262629;
    border-radius:8px;
    padding:9px 14px;
    font-size:13px;
    cursor:pointer;
    transition:background .15s, transform .1s;
    font-weight:500;
  }
  button:hover{background:#1d1d21;}
  button:active{transform:scale(0.96);}
  button.primary{
    background:var(--accent);
    border-color:var(--accent);
    color:#111;
    font-weight:700;
    min-width:72px;
  }
  button.primary:hover{background:#ff6b4f;}
  .meta{
    font-size:12px;
    color:var(--muted);
    display:flex;
    gap:16px;
    font-variant-numeric:tabular-nums;
  }
  .speed{
    display:flex;
    align-items:center;
    gap:8px;
    font-size:12px;
    color:var(--muted);
  }
  select{
    background:var(--panel);
    color:var(--text);
    border:1px solid #262629;
    border-radius:6px;
    padding:6px 8px;
    font-size:12px;
  }
  .hint{
    font-size:11px;
    color:var(--muted);
    text-align:center;
    margin-top:4px;
  }
  .hint kbd{
    background:var(--panel);
    border:1px solid #262629;
    border-radius:4px;
    padding:1px 5px;
    font-family:inherit;
  }
</style>
</head>
<body>

  <h1>FABX Innovations Cine <span>— Frame-by-Frame Viewer</span></h1>

  <div class="stage">
    <img id="frameImg" src="frames/frame_0001.jpg" alt="frame">
    <div class="frame-tag" id="frameTag">1 / 240</div>
  </div>

  <div class="controls">
    <input type="range" class="scrub" id="scrub" min="1" max="240" value="1" step="1">

    <div class="row">
      <div class="btns">
        <button id="first">⏮ First</button>
        <button id="prev">◀ Prev</button>
        <button id="playPause" class="primary">▶ Play</button>
        <button id="next">Next ▶</button>
        <button id="last">Last ⏭</button>
      </div>
      <div class="speed">
        FPS:
        <select id="fps">
          <option value="6">6</option>
          <option value="12">12</option>
          <option value="24" selected>24</option>
          <option value="30">30</option>
          <option value="60">60</option>
        </select>
      </div>
    </div>

    <div class="row">
      <div class="meta">
        <span id="frameTime">t = 0.000s</span>
        <span>Source: 1280×720 · 24fps · 10s · 240 frames</span>
      </div>
    </div>
    <div class="hint">
      <kbd>←</kbd> / <kbd>→</kbd> step frame · <kbd>Space</kbd> play/pause · drag slider to scrub
    </div>
  </div>

<script>
(function(){
  const TOTAL_FRAMES = 240;
  const SRC_FPS = 24; // frame rate frames were extracted at

  const img       = document.getElementById('frameImg');
  const scrub      = document.getElementById('scrub');
  const frameTag    = document.getElementById('frameTag');
  const frameTime    = document.getElementById('frameTime');
  const playPauseBtn = document.getElementById('playPause');
  const fpsSelect    = document.getElementById('fps');

  let current = 1;
  let playing = false;
  let timer = null;

  function pad4(n){ return String(n).padStart(4,'0'); }

  function frameSrc(n){
    return 'frames/frame_' + pad4(n) + '.jpg';
  }

  function render(){
    img.src = frameSrc(current);
    scrub.value = current;
    frameTag.textContent = current + ' / ' + TOTAL_FRAMES;
    frameTime.textContent = 't = ' + ((current - 1) / SRC_FPS).toFixed(3) + 's';
  }

  function goTo(n){
    current = Math.min(TOTAL_FRAMES, Math.max(1, n));
    render();
  }

  function step(delta){
    let n = current + delta;
    if(n > TOTAL_FRAMES) n = 1;      // loop
    if(n < 1) n = TOTAL_FRAMES;
    goTo(n);
  }

  function play(){
    playing = true;
    playPauseBtn.textContent = '⏸ Pause';
    const fps = parseInt(fpsSelect.value, 10);
    timer = setInterval(() => step(1), 1000 / fps);
  }

  function pause(){
    playing = false;
    playPauseBtn.textContent = '▶ Play';
    clearInterval(timer);
  }

  playPauseBtn.addEventListener('click', () => playing ? pause() : play());
  document.getElementById('next').addEventListener('click', () => { pause(); step(1); });
  document.getElementById('prev').addEventListener('click', () => { pause(); step(-1); });
  document.getElementById('first').addEventListener('click', () => { pause(); goTo(1); });
  document.getElementById('last').addEventListener('click', () => { pause(); goTo(TOTAL_FRAMES); });

  scrub.addEventListener('input', (e) => {
    pause();
    goTo(parseInt(e.target.value, 10));
  });

  fpsSelect.addEventListener('change', () => {
    if(playing){ pause(); play(); }
  });

  document.addEventListener('keydown', (e) => {
    if(e.code === 'ArrowRight'){ pause(); step(1); }
    else if(e.code === 'ArrowLeft'){ pause(); step(-1); }
    else if(e.code === 'Space'){ e.preventDefault(); playing ? pause() : play(); }
  });

  // preload all frames for smooth scrubbing/playback
  for(let i = 1; i <= TOTAL_FRAMES; i++){
    const preload = new Image();
    preload.src = frameSrc(i);
  }

  render();
})();
</script>

</body>
</html>
