<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070c18"/>
      <stop offset="50%" stop-color="#0f1930"/>
      <stop offset="100%" stop-color="#040810"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Clean Background -->
  <rect width="1280" height="720" fill="url(#bgGrad)"/>

  <!-- High-Tech Cyber Grid -->
  <g stroke="rgba(14,165,233,0.18)" stroke-width="1.5">
    <line x1="0" y1="0" x2="0" y2="720"/><line x1="85" y1="0" x2="85" y2="720"/><line x1="170" y1="0" x2="170" y2="720"/><line x1="255" y1="0" x2="255" y2="720"/><line x1="340" y1="0" x2="340" y2="720"/><line x1="425" y1="0" x2="425" y2="720"/><line x1="510" y1="0" x2="510" y2="720"/><line x1="595" y1="0" x2="595" y2="720"/><line x1="680" y1="0" x2="680" y2="720"/><line x1="765" y1="0" x2="765" y2="720"/><line x1="850" y1="0" x2="850" y2="720"/><line x1="935" y1="0" x2="935" y2="720"/><line x1="1020" y1="0" x2="1020" y2="720"/><line x1="1105" y1="0" x2="1105" y2="720"/><line x1="1190" y1="0" x2="1190" y2="720"/><line x1="1275" y1="0" x2="1275" y2="720"/>
    <line x1="0" y1="0" x2="1280" y2="0"/><line x1="0" y1="72" x2="1280" y2="72"/><line x1="0" y1="144" x2="1280" y2="144"/><line x1="0" y1="216" x2="1280" y2="216"/><line x1="0" y1="288" x2="1280" y2="288"/><line x1="0" y1="360" x2="1280" y2="360"/><line x1="0" y1="432" x2="1280" y2="432"/><line x1="0" y1="504" x2="1280" y2="504"/><line x1="0" y1="576" x2="1280" y2="576"/><line x1="0" y1="648" x2="1280" y2="648"/>
  </g>

  <!-- Animated Core Vectors -->
  <g filter="url(#glow)">
    <circle cx="764.7409133863715" cy="300.31518849521353" r="123.87507176420257" fill="none" stroke="#0ea5e9" stroke-width="4" stroke-dasharray="20 10"/>
    <circle cx="764.7409133863715" cy="300.31518849521353" r="74.32504305852154" fill="rgba(14,165,233,0.18)" stroke="#22d3ee" stroke-width="3"/>
    <circle cx="764.7409133863715" cy="300.31518849521353" r="20" fill="#38bdf8"/>

    <!-- Orbital Nodes -->
    <circle cx="901.0245880759445" cy="567.7869601698158" r="12" fill="#0ea5e9"/>
    <circle cx="753.7715932820342" cy="160.93676143286743" r="14" fill="#10b981"/>
    <circle cx="668.7122573281681" cy="57.77448936709433" r="10" fill="#f59e0b"/>

    <!-- Connecting Vectors -->
    <line x1="764.7409133863715" y1="300.31518849521353" x2="901.0245880759445" y2="567.7869601698158" stroke="rgba(14,165,233,0.8)" stroke-width="2.5" stroke-dasharray="6 6"/>
    <line x1="764.7409133863715" y1="300.31518849521353" x2="753.7715932820342" y2="160.93676143286743" stroke="rgba(16,185,129,0.8)" stroke-width="2.5" stroke-dasharray="6 6"/>
  </g>
</svg>