<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FABX Innovations Cine — Frame-by-Frame Viewer</title>
<style>
  :root{
    --bg:#05070c;
    --panel:#0d111a;
    --accent:#0ea5e9;
    --accent-hover:#38bdf8;
    --text:#eaeaea;
    --muted:#8a8a90;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
    display:flex;
    flex-direction:column;
    align-items:center;
    min-height:100vh;
    padding:24px 16px 40px;
  }
  h1{
    font-size:15px;
    letter-spacing:0.08em;
    text-transform:uppercase;
    color:var(--muted);
    font-weight:600;
    margin:0 0 18px;
    display:flex;
    align-items:center;
    gap:10px;
  }
  h1 span{color:var(--text);}
  .back-btn{
    color:var(--accent);
    text-decoration:none;
    font-size:12px;
    background:rgba(14,165,233,0.1);
    border:1px solid rgba(14,165,233,0.3);
    padding:4px 10px;
    border-radius:6px;
    transition:all 0.2s;
  }
  .back-btn:hover{
    background:rgba(14,165,233,0.2);
    color:#fff;
  }
  .stage{
    position:relative;
    width:min(92vw, 1000px);
    aspect-ratio: 16/9;
    background:#000;
    border-radius:12px;
    overflow:hidden;
    box-shadow:0 20px 60px rgba(0,0,0,0.8), 0 0 40px rgba(14,165,233,0.15);
    border:1px solid rgba(255,255,255,0.12);
  }
  .stage img{
    display:block;
    width:100%;
    height:100%;
    object-fit:cover;
  }
  .frame-tag{
    position:absolute;
    top:16px;
    left:16px;
    background:rgba(5,7,12,0.8);
    backdrop-filter:blur(8px);
    padding:6px 14px;
    border-radius:20px;
    font-size:12px;
    color:var(--accent);
    font-weight:bold;
    letter-spacing:0.05em;
    border:1px solid rgba(14,165,233,0.3);
  }
  .controls{
    width:min(92vw, 1000px);
    margin-top:20px;
    display:flex;
    flex-direction:column;
    gap:14px;
    background:var(--panel);
    padding:20px;
    border-radius:12px;
    border:1px solid rgba(255,255,255,0.08);
  }
  .scrub{
    -webkit-appearance:none;
    appearance:none;
    width:100%;
    height:6px;
    border-radius:3px;
    background:#1a2130;
    outline:none;
  }
  .scrub::-webkit-slider-thumb{
    -webkit-appearance:none;
    appearance:none;
    width:18px;height:18px;
    border-radius:50%;
    background:var(--accent);
    cursor:pointer;
    border:2px solid #fff;
    box-shadow:0 0 10px var(--accent);
    margin-top:-6px;
  }
  .scrub::-moz-range-thumb{
    width:16px;height:16px;
    border-radius:50%;
    background:var(--accent);
    cursor:pointer;
    border:2px solid #fff;
    box-shadow:0 0 10px var(--accent);
  }
  .row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    flex-wrap:wrap;
  }
  .btns{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
  }
  button{
    background:#151b27;
    color:var(--text);
    border:1px solid rgba(255,255,255,0.12);
    border-radius:8px;
    padding:10px 16px;
    font-size:13px;
    cursor:pointer;
    transition:all .15s;
    font-weight:600;
    font-family:inherit;
  }
  button:hover{
    background:#1e2738;
    border-color:rgba(14,165,233,0.4);
  }
  button:active{transform:scale(0.96);}
  button.primary{
    background:var(--accent);
    border-color:var(--accent);
    color:#000;
    font-weight:700;
    min-width:84px;
  }
  button.primary:hover{
    background:var(--accent-hover);
    box-shadow:0 0 16px rgba(14,165,233,0.4);
  }
  .meta{
    font-size:12px;
    color:var(--muted);
    display:flex;
    gap:20px;
  }
  .speed{
    display:flex;
    align-items:center;
    gap:8px;
    font-size:12px;
    color:var(--muted);
  }
  select{
    background:#151b27;
    color:var(--text);
    border:1px solid rgba(255,255,255,0.12);
    border-radius:6px;
    padding:6px 10px;
    font-size:12px;
    font-family:inherit;
  }
  .hint{
    font-size:11px;
    color:var(--muted);
    text-align:center;
    margin-top:6px;
  }
  .hint kbd{
    background:#151b27;
    border:1px solid rgba(255,255,255,0.12);
    border-radius:4px;
    padding:2px 6px;
    color:var(--text);
  }
</style>
</head>
<body>

  <h1>
    <a href="/" class="back-btn">← Home</a>
    FABX Innovations Cine <span>— Frame-by-Frame Viewer</span>
  </h1>

  <div class="stage">
    <img id="frameImg" src="/frames/frame_0001.jpg" alt="frame">
    <div class="frame-tag" id="frameTag">FRAME 1 / 240</div>
  </div>

  <div class="controls">
    <input type="range" class="scrub" id="scrub" min="1" max="240" value="1" step="1">

    <div class="row">
      <div class="btns">
        <button id="first">⏮ First</button>
        <button id="prev">◀ Prev</button>
        <button id="playPause" class="primary">▶ Play</button>
        <button id="next">Next ▶</button>
        <button id="last">Last ⏭</button>
      </div>
      <div class="speed">
        FPS:
        <select id="fps">
          <option value="6">6 FPS</option>
          <option value="12">12 FPS</option>
          <option value="24" selected>24 FPS</option>
          <option value="30">30 FPS</option>
          <option value="60">60 FPS</option>
        </select>
      </div>
    </div>

    <div class="row">
      <div class="meta">
        <span id="frameTime">t = 0.000s</span>
        <span>Source: 1280×720 · 24fps · 10s · 240 frames</span>
      </div>
    </div>
    <div class="hint">
      <kbd>←</kbd> / <kbd>→</kbd> step frame · <kbd>Space</kbd> play/pause · drag slider to scrub
    </div>
  </div>

<script>
(function(){
  const TOTAL_FRAMES = 240;
  const SRC_FPS = 24;

  const img          = document.getElementById('frameImg');
  const scrub        = document.getElementById('scrub');
  const frameTag     = document.getElementById('frameTag');
  const frameTime    = document.getElementById('frameTime');
  const playPauseBtn = document.getElementById('playPause');
  const fpsSelect    = document.getElementById('fps');

  let current = 1;
  let playing = false;
  let timer = null;

  function pad4(n){ return String(n).padStart(4,'0'); }

  function frameSrc(n){
    return '/frames/frame_' + pad4(n) + '.jpg';
  }

  function render(){
    img.src = frameSrc(current);
    scrub.value = current;
    frameTag.textContent = 'FRAME ' + current + ' / ' + TOTAL_FRAMES;
    frameTime.textContent = 't = ' + ((current - 1) / SRC_FPS).toFixed(3) + 's';
  }

  function goTo(n){
    current = Math.min(TOTAL_FRAMES, Math.max(1, n));
    render();
  }

  function step(delta){
    let n = current + delta;
    if(n > TOTAL_FRAMES) n = 1;
    if(n < 1) n = TOTAL_FRAMES;
    goTo(n);
  }

  function play(){
    playing = true;
    playPauseBtn.textContent = '⏸ Pause';
    const fps = parseInt(fpsSelect.value, 10);
    timer = setInterval(() => step(1), 1000 / fps);
  }

  function pause(){
    playing = false;
    playPauseBtn.textContent = '▶ Play';
    clearInterval(timer);
  }

  playPauseBtn.addEventListener('click', () => playing ? pause() : play());
  document.getElementById('next').addEventListener('click', () => { pause(); step(1); });
  document.getElementById('prev').addEventListener('click', () => { pause(); step(-1); });
  document.getElementById('first').addEventListener('click', () => { pause(); goTo(1); });
  document.getElementById('last').addEventListener('click', () => { pause(); goTo(TOTAL_FRAMES); });

  scrub.addEventListener('input', (e) => {
    pause();
    goTo(parseInt(e.target.value, 10));
  });

  fpsSelect.addEventListener('change', () => {
    if(playing){ pause(); play(); }
  });

  document.addEventListener('keydown', (e) => {
    if(e.code === 'ArrowRight'){ pause(); step(1); }
    else if(e.code === 'ArrowLeft'){ pause(); step(-1); }
    else if(e.code === 'Space'){ e.preventDefault(); playing ? pause() : play(); }
  });

  for(let i = 1; i <= TOTAL_FRAMES; i++){
    const preload = new Image();
    preload.src = frameSrc(i);
  }

  render();
})();
</script>

</body>
</html>
